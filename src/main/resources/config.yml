# Main configuration for VelocityCore

# Discord Bot settings
discord-bot:
  enabled: true
  token: "YOUR_DISCORD_BOT_TOKEN"
  status: "with the GraviJet Network"
  bug-report-channel: "YOUR_BUG_REPORT_CHANNEL_ID"

# Database settings
database:
  host: "localhost"
  port: 3306
  database: "velocity"
  username: "user"
  password: "password"

# JoinMe settings
joinme:
  cooldown: 60 # in seconds
  tokens:
    initial: 5
    monthly: 2
    permanent: 0

# Advertising settings
advertising:
  enabled: true
  interval_minutes: 5
  messages:
    - "<gold>Welcome to the GraviJet Network!"
    - "<white>Check out our website: <red>example.invalid"
    - "<yellow>Don't forget to vote for rewards!"

# Support system settings
support:
  enabled: true
  discord:
    enabled: true
    bot-token: "YOUR_DISCORD_BOT_TOKEN_HERE"
    guild-id: "YOUR_DISCORD_GUILD_ID_HERE"
    support-category-id: "YOUR_DISCORD_SUPPORT_CATEGORY_ID_HERE"
    transcript-channel-id: "YOUR_DISCORD_TRANSCRIPT_CHANNEL_ID_HERE"
    staff-role-id: "YOUR_DISCORD_STAFF_ROLE_ID_HERE"
    management-role-id: "YOUR_DISCORD_MANAGEMENT_ROLE_ID_HERE"
    channel-name-format: "{status}-{language}-{player}-{server}" # e.g., o-en-gravijet-lobby
    open-color: "BLUE" # Embed color for open tickets
    claimed-color: "YELLOW" # Embed color for claimed tickets
    transcript-color: "PURPLE" # Embed color for transcript messages
  bug-channel-id: "YOUR_BUG_REPORT_CHANNEL_ID_HERE"
  bug-tag-id: ""
  max-open-tickets: 3
  ticket-cooldown-minutes: 10
  staff-permission: "velocitycore.support.staff"
