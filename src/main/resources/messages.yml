  already-rated: "<red>VelocityCore <dark_gray>» <white>You have already rated this support session."
  rating-expired: "<red>VelocityCore <dark_gray>» <white>The time to rate this session has expired."
  rating-received: "<red>VelocityCore <dark_gray>» <white>Thank you for your rating of <red>{rating}/5<white>."
  rating-prompt: "<red>VelocityCore <dark_gray>» <white>Rate your support experience: <red>/support rate (1-5)"
  player-online-status: "<red>VelocityCore <dark_gray>» <red>{player} <white>is now online."
  player-offline-status: "<red>VelocityCore <dark_gray>» <red>{player} <white>has gone offline."
  you-are-banned: "<red>VelocityCore <dark_gray>» <white>You are banned from the support system. Remaining: <red>{duration}<white>."
  player-banned: "<red>VelocityCore <dark_gray>» <white>You have banned <red>{player} <white>from the support system for <red>{duration}<white>."
  you-are-unbanned: "<red>VelocityCore <dark_gray>» <white>You have been unbanned from the support system."
  player-unbanned: "<red>VelocityCore <dark_gray>» <white>You have unbanned <red>{player}<white>."
  not-banned: "<red>VelocityCore <dark_gray>» <red>{player} <white>is not banned from the support system."
