    - "<red>● /support de/en <dark_gray>» <white>Open a ticket."
    - "<red>● /support claim <white>(player) <dark_gray>» <white>Claim a player's ticket."
    - "<red>● /support close <dark_gray>» <white>Close the current session."
    - "<red>● /support chat <white>(message) <dark_gray>» <white>Chat in the active session."
    - "<red>● /support ban <white>(player) (duration) <dark_gray>» <white>Ban a player from support."
    - "<red>● /support unban <white>(player) <dark_gray>» <white>Unban a player from support."
  discord:
