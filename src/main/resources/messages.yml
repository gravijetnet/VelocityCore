# Messages for VelocityCore
# Uses MiniMessage format: <red>, <white>, <green>, <yellow>, <gray>, <dark_gray>, <dark_purple>, <bold>, etc.
# Placeholders use {key} syntax.

prefix: "<red>GraviJet <dark_gray>» <white>"

general:
  no-permission: "<red>You don't have permission to use this command."
  players-only: "<red>This command can only be used by players."
  player-not-found: "<red>Player <white>{player} <red>was not found."
  invalid-amount: "<red>Invalid amount specified."

reload:
  success: "<green>Configuration reloaded successfully."
  failure: "<red>Failed to reload configuration."

ping:
  console: "<red>This command can only be used by players."
  self: "<red>GraviJet <dark_gray>» <white>Your ping: {color}{ping}ms"
  other: "<red>GraviJet <dark_gray>» <white>Ping of <red>{player}<white>: {color}{ping}ms"

find:
  usage: "<red>Usage: <white>/find <player>"
  online: "<red>GraviJet <dark_gray>» <white>{player} <white>is currently on <red>{server}<white>."
  offline: "<red>GraviJet <dark_gray>» <white>{player} <white>was last seen on <red>{server} <white>at <red>{time}<white>."

hoster:
  message: "<red>example.invalid <white>is powered by <red>Index-Hosting.com<white>.\n <gray>Get 10% off with code <dark_purple>GRAVI<white>."

joinme:
  no-perm: "<red>You don't have permission to use JoinMe."
  status_format: |-
    <red>GraviJet <dark_gray>» <white><bold>JoinMe Tokens</bold>
    <red>Status<dark_gray>:     <white>{status}
    <red>Total<dark_gray>:      <white>{total}
    <red>Monthly<dark_gray>:    <white>{monthly} <gray>(resets monthly)
    <red>Permanent<dark_gray>:  <white>{permanent} <gray>(never expires)
    <red>Cooldown<dark_gray>:   <white>{cooldown}
  on_cooldown: "<red>You are on cooldown for another <white>{cooldown} <red>seconds."
  no_tokens: "<red>You don't have enough JoinMe tokens."
  broadcast: "<red>JoinMe <dark_gray>» {color}{player} <white>wants you to join! <gray>(click)"

joinme-color:
  usage: "<red>Usage: <white>/joinmecolor <red><color> <white>or <white>/joinmecolor reset"
  reset: "<green>Your JoinMe color has been reset to default."
  set: "<green>Your JoinMe color has been updated."

tokens:
  error: "<red>Could not retrieve your token data."
  status:
    unlimited: "<green>Unlimited"
    available: "<green>Available"
    empty: "<red>Out of tokens"
  cooldown:
    bypassed: "<green>Bypassed"
    ready: "<green>Ready"
  info: |-
    <red>GraviJet <dark_gray>» <white><bold>JoinMe Tokens</bold>
    <red>Status<dark_gray>:     <white>{status}
    <red>Total<dark_gray>:      <white>{total}
    <red>Monthly<dark_gray>:    <white>{monthly} <gray>(resets monthly)
    <red>Permanent<dark_gray>:  <white>{permanent} <gray>(never expires)
    <red>Cooldown<dark_gray>:   <white>{cooldown}
  store-link: "<white>Buy more tokens at <red>example.invalid<white>."

admin-joinme:
  help:
    - "<red>GraviJet <dark_gray>» <white><bold>AdminJoinMe Help</bold>"
    - "<white>/ajm tokens <red><player> <dark_gray>» <white>View a player's tokens."
    - "<white>/ajm forcejoinme <red><player> <dark_gray>» <white>Force a JoinMe for a player."
    - "<white>/ajm addtokens <red><player> <amount> <dark_gray>» <white>Add permanent tokens."
    - "<white>/ajm removetokens <red><player> <amount> <dark_gray>» <white>Remove permanent tokens."
  tokens-header: "<red>GraviJet <dark_gray>» <white>Tokens for <red>{player}"
  tokens-error: "<red>Could not retrieve token data for that player."
  force-success: "<green>Successfully forced a JoinMe for <white>{player}<green>."
  force-received: "<green>An admin has activated a JoinMe for you."
  add-success: "<green>Added <white>{amount} <green>permanent tokens to <white>{player}<green>."
  add-received: "<green>An admin has given you <white>{amount} <green>permanent tokens."
  add-failed: "<red>Failed to add tokens."
  remove-success: "<green>Removed <white>{amount} <green>permanent tokens from <white>{player}<green>."
  remove-received: "<red>An admin has removed <white>{amount} <red>permanent tokens from you."
  remove-failed: "<red>Failed to remove tokens."

support:
  chat-usage: "<red>Usage: <white>/spc <message>"
  ticket-created: "<green>Your support ticket has been created. A staff member will be with you shortly."
  ticket-closed: "<green>Your support ticket has been closed."
  ticket-closed-staff: "<green>Support ticket for <white>{player} <green>has been closed."
  ticket-auto-closed: "<yellow>Your support ticket was closed due to inactivity."
  ticket-cooldown: "<red>Please wait <white>{cooldown} <red>minutes before opening another ticket."
  max-tickets: "<red>You have reached the maximum number of open tickets <white>({max})<red>."
  no-open-ticket: "<red>You don't have an open support ticket."
  staff-notification: "<red>New ticket <dark_gray>» <white>{player} <white>on <red>{server}"
  staff-chat-format: "<red>[Support] <white>{player}<dark_gray>: <white>{message}"
  staff-enter: "<green>You have entered support chat."
  staff-leave: "<red>You have left support chat."
  staff-cannot-request: "<red>Staff members cannot create support tickets."
  already-in-session: "<red>You already have an open support ticket."
  no-active-session-for-player: "<red>No active session found for <white>{player}<red>."
  already-handling-session: "<red>You are already handling a support session."
  already-claimed: "<red>This ticket has already been claimed by <white>{staff}<red>."
  claimed-by-you: "<green>You have claimed the support ticket for <white>{player}<green>."
  claimed-by-staff: "<green>{staff} <green>has claimed your support ticket."
  invalid-rating: "<red>Invalid rating. Please enter a number between 1 and 5."
  not-session-player: "<red>You don't have a recently closed session to rate."
  already-rated: "<red>You have already rated this support session."
  rating-expired: "<red>The time to rate this session has expired."
  rating-received: "<green>Thank you for your rating of <white>{rating}/5<green>."
  rating-prompt: "<yellow>Rate your support experience: <white>/support rate <1-5>"
  player-online-status: "<gray>{player} is now online."
  player-offline-status: "<gray>{player} has gone offline."
  you-are-banned: "<red>You are banned from the support system. Remaining: <white>{duration}<red>."
  player-banned: "<green>You have banned <white>{player} <green>from the support system for <white>{duration}<green>."
  invalid-duration: "<red>Invalid duration format. Use 1d, 2h, 30m, etc."
  you-are-unbanned: "<green>You have been unbanned from the support system."
  player-unbanned: "<green>You have unbanned <white>{player}<green>."
  invalid-command: "<red>Unknown subcommand. Use <white>/support help <red>for available commands."
  player-help:
    - "<red>GraviJet <dark_gray>» <white><bold>Support</bold>"
    - "<white>/support de <dark_gray>» <white>Open a ticket in German."
    - "<white>/support en <dark_gray>» <white>Open a ticket in English."
    - "<white>/support chat <message> <dark_gray>» <white>Send a message in your ticket."
    - "<white>/support rate <1-5> <dark_gray>» <white>Rate your closed ticket."
  staff-help:
    - "<red>GraviJet <dark_gray>» <white><bold>Support</bold> <red>(Staff)"
    - "<white>/support de/en <dark_gray>» <white>Open a ticket."
    - "<white>/support claim <player> <dark_gray>» <white>Claim a player's ticket."
    - "<white>/support close <dark_gray>» <white>Close the current session."
    - "<white>/support chat <message> <dark_gray>» <white>Chat in the active session."
  discord:
    already-claimed: "This ticket has already been claimed by {staff}."
    please-claim: "Please claim this ticket before replying."
    only-claimer-can-close: "Only the staff member who claimed this ticket can close it."
    claim-message: "{staff} has claimed this ticket."
    transfer-message: "This ticket has been transferred from {fromStaff} to {toStaff}."
    status-message: "Player status: {status}"
    transcript-title: "Support Transcript"
    transcript-player-field: "Player"
    transcript-language-field: "Language"
    transcript-date-field: "Date"
    rating-title: "New Rating"

bug:
  usage: "<red>Usage: <white>/bug <title> <description>"
  title-too-long: "<red>Title is too long. Maximum 100 characters."
  message-too-long: "<red>Description is too long. Maximum 1000 characters."
  discord-not-available: "<red>Bug reporting is currently unavailable. Please try again later."
  report-sent: "<green>Your bug report <white>\"{title}\" <green>has been submitted. Thank you!"
  report-failed: "<red>Failed to send your bug report. Please try again later."
