# Messages for VelocityCore
# Uses MiniMessage format: <red>, <white>, <green>, <yellow>, <gray>, <dark_gray>, <dark_purple>, <bold>, etc.
# Placeholders use {key} syntax.

prefix: "<red>VelocityCore <dark_gray>» <white>"

general:
  no-permission: "<red>VelocityCore <dark_gray>» <white>You don't have permission to use this command."
  players-only: "<red>VelocityCore <dark_gray>» <white>This command can only be used by players."
  player-not-found: "<red>VelocityCore <dark_gray>» <white>Player <red>{player} <white>was not found."
  invalid-amount: "<red>VelocityCore <dark_gray>» <white>Invalid amount specified."

reload:
  success: "<red>VelocityCore <dark_gray>» <white>Configuration reloaded successfully."
  failure: "<red>VelocityCore <dark_gray>» <white>Failed to reload configuration."

ping:
  console: "<red>VelocityCore <dark_gray>» <white>This command can only be used by players."
  self: "<red>VelocityCore <dark_gray>» <white>Your ping: {color}{ping}ms"
  other: "<red>VelocityCore <dark_gray>» <white>Ping of <red>{player}<white>: {color}{ping}ms"

find:
  usage: "<red>VelocityCore <dark_gray>» <white>Usage: <red>/find (player)"
  online: "<red>VelocityCore <dark_gray>» <red>{player} <white>is currently on <red>{server}<white>."
  offline: "<red>VelocityCore <dark_gray>» <red>{player} <white>was last seen on <red>{server} <white>at <red>{time}<white>."

hoster:
  message: "<white>Powered by <red>Index-Hosting.com<white>.\n <gray>Get 10% off with code <dark_purple>GRAVI<white>."

joinme:
  no-perm: "<red>VelocityCore <dark_gray>» <white>You don't have permission to use JoinMe."
  status_format: |-
    <red>VelocityCore <dark_gray>- <white>JoinMe Tokens
    <red>● Status     <dark_gray>» <white>{status}
    <red>● Total      <dark_gray>» <white>{total}
    <red>● Monthly    <dark_gray>» <white>{monthly} <gray>(resets monthly)
    <red>● Permanent  <dark_gray>» <white>{permanent} <gray>(never expires)
    <red>● Cooldown   <dark_gray>» <white>{cooldown}
  on_cooldown: "<red>VelocityCore <dark_gray>» <white>You are on cooldown for another <red>{cooldown} <white>seconds."
  no_tokens: "<red>VelocityCore <dark_gray>» <white>You don't have enough JoinMe tokens."
  broadcast: "<red>JoinMe <dark_gray>» {color}{player} <white>wants you to join! <gray>(click to join)"

joinme-color:
  usage: "<red>VelocityCore <dark_gray>» <white>Usage: <red>/joinmecolor (color) <white>or <red>/joinmecolor reset"
  reset: "<red>VelocityCore <dark_gray>» <white>Your JoinMe color has been reset to default."
  set: "<red>VelocityCore <dark_gray>» <white>Your JoinMe color has been updated."

tokens:
  error: "<red>VelocityCore <dark_gray>» <white>Could not retrieve your token data."
  status:
    unlimited: "<green>Unlimited"
    available: "<green>Available"
    empty: "<red>Out of tokens"
  cooldown:
    bypassed: "<green>Bypassed"
    ready: "<green>Ready"
  info: |-
    <red>VelocityCore <dark_gray>- <white>JoinMe Tokens
    <red>● Status     <dark_gray>» <white>{status}
    <red>● Total      <dark_gray>» <white>{total}
    <red>● Monthly    <dark_gray>» <white>{monthly} <gray>(resets monthly)
    <red>● Permanent  <dark_gray>» <white>{permanent} <gray>(never expires)
    <red>● Cooldown   <dark_gray>» <white>{cooldown}
  store-link: "<red>VelocityCore <dark_gray>» <white>Buy more tokens at <red>example.invalid<white>."

admin-joinme:
  help:
    - "<red>VelocityCore <dark_gray>- <white>AdminJoinMe"
    - "<red>● /ajm tokens <white>(player) <dark_gray>» <white>View a player's tokens."
    - "<red>● /ajm forcejoinme <white>(player) <dark_gray>» <white>Force a JoinMe for a player."
    - "<red>● /ajm addtokens <white>(player) (amount) <dark_gray>» <white>Add permanent tokens."
    - "<red>● /ajm removetokens <white>(player) (amount) <dark_gray>» <white>Remove permanent tokens."
  tokens-header: "<red>VelocityCore <dark_gray>» <white>Tokens for <red>{player}"
  tokens-error: "<red>VelocityCore <dark_gray>» <white>Could not retrieve token data for that player."
  force-success: "<red>VelocityCore <dark_gray>» <white>Successfully forced a JoinMe for <red>{player}<white>."
  force-received: "<red>VelocityCore <dark_gray>» <white>An admin has activated a JoinMe for you."
  add-success: "<red>VelocityCore <dark_gray>» <white>Added <red>{amount} <white>permanent tokens to <red>{player}<white>."
  add-received: "<red>VelocityCore <dark_gray>» <white>An admin has given you <red>{amount} <white>permanent tokens."
  add-failed: "<red>VelocityCore <dark_gray>» <white>Failed to add tokens."
  remove-success: "<red>VelocityCore <dark_gray>» <white>Removed <red>{amount} <white>permanent tokens from <red>{player}<white>."
  remove-received: "<red>VelocityCore <dark_gray>» <white>An admin has removed <red>{amount} <white>permanent tokens from you."
  remove-failed: "<red>VelocityCore <dark_gray>» <white>Failed to remove tokens."

