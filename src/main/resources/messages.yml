# Messages for VelocityCore
# Uses legacy & color codes (&c = red, &f = white, &a = green, &e = yellow, etc.)
# Placeholders use {key} syntax.

prefix: "&cGraviJet &8\u00bb &f"

general:
  no-permission: "&cYou don't have permission to use this command."
  players-only: "&cThis command can only be used by players."
  player-not-found: "&cPlayer &f{player} &cwas not found."
  invalid-amount: "&cInvalid amount specified."

reload:
