    - "<red>● /support en <dark_gray>» <white>Open a ticket in English."
    - "<red>● /support chat <white>(message) <dark_gray>» <white>Send a message in your ticket."
    - "<red>● /support rate <white>(1-5) <dark_gray>» <white>Rate your closed ticket."
  staff-help:
