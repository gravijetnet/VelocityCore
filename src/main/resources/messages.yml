# Messages for VelocityCore
# Uses MiniMessage format: https://docs.adventure.kyori.net/minimessage/format.html

prefix: "<#ff0000>&lGraviJet <dark_gray>» <white>"

general:
  no-permission: "<red>You do not have permission to use this command.</red>"
  players-only: "<red>This command can only be used by players.</red>"
  player-not-found: "<red>Player <white><player></white> not found.</red>"
  invalid-amount: "<red>Invalid amount specified.</red>"

reload:
  success: "<green>Configuration reloaded successfully.</green>"
  failure: "<red>Failed to reload configuration.</red>"

joinme:
  no-perm: "<red>You do not have permission to use JoinMe.</red>"
  status_format: |-
    <prefix><bold>JoinMe Tokens</bold>
    <red>Status<dark_gray>:    <white>{status}
    <red>Total<dark_gray>:     <white>{total}
    <red>Monthly<dark_gray>:   <white>{monthly} <dark_gray>(<gray>resets monthly</gray>)
    <red>Permanent<dark_gray>: <white>{permanent} <dark_gray>(<gray>never expires</gray>)
    <red>Cooldown<dark_gray>:  <white>{cooldown}"
  on_cooldown: "<red>You are on cooldown for another {cooldown} seconds.</red>"
  no_tokens: "<red>You do not have enough JoinMe tokens.</red>"
  broadcast: "<aqua>{player} has activated a JoinMe! Click here to join their server!</aqua>"

tokens:
  error: "<red>Could not retrieve your token data.</red>"
  status:
    unlimited: "<green>Unlimited</green>"
    available: "<green>Available</green>"
    empty: "<red>Out of tokens</red>"
  cooldown:
    bypassed: "<green>Bypassed</green>"
    ready: "<green>Ready</green>"
  info: |-
    <#ff0000>&lGraviJet <dark_gray>» <white>&lJoinMe Tokens
    <#ff0000>Status<dark_gray>:    <white><status>
    <#ff0000>Total<dark_gray>:     <white><total>
    <#ff0000>Monthly<dark_gray>:   <white><monthly> <dark_gray>(resets monthly)
    <#ff0000>Permanent<dark_gray>: <white><permanent> <dark_gray>(never expires)
    <#ff0000>Cooldown<dark_gray>:  <white><cooldown>
  store-link: "<gold>Click here to buy more tokens!</gold><click:open_url:'https://example.invalid'>"

admin-joinme:
  help:
    - "<prefix><bold>AdminJoinMe Help</bold>"
    - "<gray>/ajm tokens <player> - View a player's tokens."
    - "<gray>/ajm forcejoinme <player> - Force a JoinMe for a player."
    - "<gray>/ajm addtokens <player> <amount> - Add permanent tokens to a player."
    - "<gray>/ajm removetokens <player> <amount> - Remove permanent tokens from a player."
  tokens-header: "<prefix>Tokens for <white><player></white>"
  tokens-error: "<red>Could not retrieve token data for that player.</red>"
  force-success: "<green>Successfully forced a JoinMe for <white><player></white>.</green>"
  force-received: "<green>An admin has activated a JoinMe for you.</green>"
  add-success: "<green>Added <white><amount></white> permanent tokens to <white><player></white>.</green>"
  add-received: "<green>An admin has given you <white><amount></white> permanent tokens.</green>"
  add-failed: "<red>Failed to add tokens.</red>"
  remove-success: "<green>Removed <white><amount></white> permanent tokens from <white><player></white>.</green>"
  remove-received: "<red>An admin has removed <white><amount></white> permanent tokens from you.</red>"
  remove-failed: "<red>Failed to remove tokens.</red>"

support:
  chat-usage: "<red>Usage: /spc <message></red>"
  ticket-created: "<green>Your support ticket has been created. A staff member will be with you shortly.</green>"
  ticket-closed: "<green>Your support ticket has been closed.</green>"
  ticket-auto-closed: "<yellow>Your support ticket was closed due to inactivity.</yellow>"
  ticket-cooldown: "<red>You must wait <cooldown> minutes before creating a new ticket.</red>"
  max-tickets: "<red>You have reached the maximum number of open tickets (<max>).</red>"
  no-open-ticket: "<red>You do not have an open support ticket.</red>"
  staff-notification: "<aqua>A new support ticket has been created by <player> on <server>.</aqua>"
  staff-chat-format: "<blue>[Support Chat] <player>: <message></blue>"
  staff-enter: "<green>You have entered support chat.</green>"
  staff-leave: "<red>You have left support chat.</red>"
  staff-cannot-request: "<red>Staff members cannot create support tickets.</red>"
  already-in-session: "<red>You already have an open support ticket.</red>"
  no-active-session-for-player: "<red>No active session found for <player>.</red>"
  already-handling-session: "<red>You are already handling a support session.</red>"
  already-claimed: "<red>This ticket has already been claimed by <staff>.</red>"
  claimed-by-you: "<green>You have claimed the support ticket for <player>.</green>"
  claimed-by-staff: "<green><staff> has claimed your support ticket.</green>"
  invalid-rating: "<red>Invalid rating. Please use a number between 1 and 5.</red>"
  not-session-player: "<red>You do not have a recently closed session to rate.</red>"
  already-rated: "<red>You have already rated this support session.</red>"
  rating-expired: "<red>The time to rate this session has expired.</red>"
  rating-received: "<green>Thank you for your rating of <rating>/5.</green>"
  rating-prompt: "<gold>Please rate your support experience from 1 to 5 stars.</gold>"
  player-online-status: "<gray><player> is now online.</gray>"
  player-offline-status: "<gray><player> has gone offline.</gray>"
  you-are-banned: "<red>You are banned from the support system. Remaining: <duration></red>"
  player-banned: "<green>You have banned <player> from the support system for <duration>.</green>"
  invalid-duration: "<red>Invalid duration format. Use 1d, 2h, 3m, etc.</red>"
  you-are-unbanned: "<green>You have been unbanned from the support system.</green>"
  player-unbanned: "<green>You have unbanned <player>.</green>"
  discord:
    already-claimed: "This ticket has already been claimed by {staff}."
    please-claim: "Please claim this ticket before replying."
    only-claimer-can-close: "Only the staff member who claimed this ticket can close it."
    claim-message: "{staff} has claimed this ticket."
    transfer-message: "This ticket has been transferred from {fromStaff} to {toStaff}."
    status-message: "Player status: {status}"
    transcript-title: "Support Transcript"
    transcript-player-field: "Player"
    transcript-language-field: "Language"
    transcript-date-field: "Date"
    rating-title: "New Rating"

bug:
  usage: "<red>Usage: /bug <title> <message></red>"
  title-too-long: "<red>Title is too long. Maximum 100 characters.</red>"
  message-too-long: "<red>Message is too long. Maximum 1000 characters.</red>"
  discord-not-available: "<red>Bug reporting is currently unavailable. Please try again later.</red>"
  report-sent: "<green>Bug report submitted: <title></green>"
