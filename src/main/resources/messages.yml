  ticket-auto-closed: "<red>VelocityCore <dark_gray>» <white>Your support ticket was closed due to inactivity."
  ticket-cooldown: "<red>VelocityCore <dark_gray>» <white>Please wait <red>{cooldown} <white>minutes before opening another ticket."
  max-tickets: "<red>VelocityCore <dark_gray>» <white>You have reached the maximum number of open tickets <red>({max})<white>."
  no-open-ticket: "<red>VelocityCore <dark_gray>» <white>You don't have an open support ticket."
  staff-notification: "<red>Support <dark_gray>» <white>New ticket from <red>{player} <white>on <red>{server} <gray>— click to claim"
  staff-chat-format: "<red>[Support] <red>{player}<dark_gray>: <white>{message}"
