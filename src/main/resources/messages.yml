# Messages for VelocityCore
# Uses MiniMessage format: <red>, <white>, <green>, <yellow>, <gray>, <dark_gray>, <dark_purple>, <bold>, etc.
# Placeholders use {key} syntax.

prefix: "<red>VelocityCore <dark_gray>» <white>"

general:
  no-permission: "<white>You don't have permission to use this command."
  players-only: "This command can only be used by players."
  player-not-found: "Player <red>{player} <white>was not found."
  invalid-amount: "Invalid amount specified."

reload:
  success: "Configuration reloaded successfully."
  failure: "Failed to reload configuration."

ping:
  console: "This command can only be used by players."
  self: "Your ping: {color}{ping}ms"
  other: "Ping of <red>{player}<white>: {color}{ping}ms"

find:
  usage: "Usage: <red>/find (player)"
  online: "<red>{player} <white>is currently on <red>{server}<white>."
  offline: "<red>{player} <white>was last seen on <red>{server} <white>at <red>{time}<white>."

hoster:
  message: "<white>Powered by <red>Index-Hosting.com<white>.\n<gray>Get 10% off with code <dark_purple>GRAVI<white>."

joinme:
  no-perm: "You don't have permission to use JoinMe."
  status_format: |-
    <red>VelocityCore <dark_gray>- <white>JoinMe Tokens
    <red>● Status     <dark_gray>» <white>{status}
    <red>● Total      <dark_gray>» <white>{total}
    <red>● Monthly    <dark_gray>» <white>{monthly} <gray>(resets monthly)
    <red>● Permanent  <dark_gray>» <white>{permanent} <gray>(never expires)
    <red>● Cooldown   <dark_gray>» <white>{cooldown}
  on_cooldown: "You are on cooldown for another <red>{cooldown} <white>seconds."
  no_tokens: "You don't have enough JoinMe tokens."
  broadcast: "<gray><bold><st>--------------</st><white>JOINME<gray><st>-------------</bold>\n{color}{player} <gray>is playing on {color}{server}\n<red>Join server\n<gray><bold><st>---------------------------------</st>"

joinme-color:
  usage: "Usage: <red>/joinmecolor (color) <white>or <red>/joinmecolor reset"
  reset: "Your JoinMe color has been reset to default."
  set: "Your JoinMe color has been updated."

tokens:
  error: "Could not retrieve your token data."
  status:
    unlimited: "<green>Unlimited"
    available: "<green>Available"
    empty: "<red>Out of tokens"
  cooldown:
    bypassed: "<green>Bypassed"
    ready: "<green>Ready"
  info: |-
    <red>VelocityCore <dark_gray>- <white>JoinMe Tokens
    <red>● Status     <dark_gray>» <white>{status}
    <red>● Total      <dark_gray>» <white>{total}
    <red>● Monthly    <dark_gray>» <white>{monthly} <gray>(resets monthly)
    <red>● Permanent  <dark_gray>» <white>{permanent} <gray>(never expires)
    <red>● Cooldown   <dark_gray>» <white>{cooldown}
  store-link: "Buy more tokens at <red>example.invalid<white>."

admin-joinme:
  help:
    - "<red>VelocityCore <dark_gray>- <white>AdminJoinMe"
    - "<red>● /ajm tokens <white>(player) <dark_gray>» <white>View a player's tokens."
    - "<red>● /ajm forcejoinme <white>(player) <dark_gray>» <white>Force a JoinMe for a player."
    - "<red>● /ajm addtokens <white>(player) (amount) <dark_gray>» <white>Add permanent tokens."
    - "<red>● /ajm removetokens <white>(player) (amount) <dark_gray>» <white>Remove permanent tokens."
  tokens-header: "Tokens for <red>{player}"
  tokens-error: "Could not retrieve token data for that player."
  force-success: "Successfully forced a JoinMe for <red>{player}<white>."
  force-received: "An admin has activated a JoinMe for you."
  add-success: "Added <red>{amount} <white>permanent tokens to <red>{player}<white>."
  add-received: "An admin has given you <red>{amount} <white>permanent tokens."
  add-failed: "Failed to add tokens."
  remove-success: "Removed <red>{amount} <white>permanent tokens from <red>{player}<white>."
  remove-received: "An admin has removed <red>{amount} <white>permanent tokens from you."
  remove-failed: "Failed to remove tokens."

