name: Build and Release VelocityCore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create and update releases

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Prepare JAR for Release
      run: |
        # Search for the VelocityCore JAR, excluding shaded/sources/javadoc
        JAR_PATH=$(find target/ -name "VelocityCore-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        
        if [ -z "$JAR_PATH" ]; then
          echo "Error: VelocityCore JAR not found!"
          exit 1
        fi
        
        echo "Found JAR: $JAR_PATH"
        # Copy to a clean filename for the release asset
        cp "$JAR_PATH" ./velocitycore-latest.jar

    - name: Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "VelocityCore Latest Build"
        body: "Automated VelocityCore build from commit ${{ github.sha }} \nCompiled on: ${{ github.event.head_commit.timestamp }}"
        draft: false
        prerelease: false
        files: velocitycore-latest.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
