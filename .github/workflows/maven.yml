name: Build and Permanent Release VelocityCore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Prepare JAR
      run: |
        JAR_PATH=$(find target/ -name "VelocityCore-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        if [ -z "$JAR_PATH" ]; then exit 1; fi
        cp "$JAR_PATH" ./velocitycore-build-${{ github.run_number }}.jar
        cp "$JAR_PATH" ./velocitycore-latest.jar

    - name: Create Archive Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: "VelocityCore Build #${{ github.run_number }}"
        body: "Archive of Build #${{ github.run_number }}"
        files: velocitycore-build-${{ github.run_number }}.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete Old Latest Tag
      run: |
        git tag -d latest || true
        git push origin :refs/tags/latest || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update Latest Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "VelocityCore Latest Build"
        body: "This release contains the latest executable and source code from the main branch."
        files: velocitycore-latest.jar
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
