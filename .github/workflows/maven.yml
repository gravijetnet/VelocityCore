name: Build and Release VelocityCore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # WICHTIG: Erlaubt das Erstellen von Releases

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Prepare JAR for Release
      run: |
        # Findet die richtige JAR
        JAR_PATH=$(find target/ -name "VelocityCore-*.jar" ! -name "*shaded*" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
        # Kopiert sie mit einem festen Namen für das Release
        cp "$JAR_PATH" ./velocitycore-latest.jar

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Latest Build"
        body: "Automatischer Build vom ${{ github.event.head_commit.timestamp }}"
        draft: false
        prerelease: false
        files: velocitycore-latest.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
